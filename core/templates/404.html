{% extends 'base.html' %}

{% block title %}404 - Lạc đường rồi!{% endblock %}

{% block content %}
<main class="flex-1 overflow-y-auto p-8 scroll-smooth bg-gray-50/50 flex flex-col items-center justify-center">
    <div class="flex flex-col items-center justify-center min-h-[60vh] text-center max-w-lg mx-auto">
        
        <!-- Hình ảnh/Icon 404 -->
        <div class="relative mb-6">
            <h1 class="text-[150px] font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-blue-500 to-indigo-600 leading-none drop-shadow-md tracking-tighter">404</h1>
            <div class="absolute -top-4 -right-10 text-indigo-400 animate-bounce">
                <i data-lucide="ghost" class="w-20 h-20"></i>
            </div>
        </div>
        
        <!-- Tiêu đề & Mô tả -->
        <h2 class="text-3xl font-bold text-gray-900 mb-4">Ôi không! Lạc đường rồi bạn ơi...</h2>
        <p class="text-gray-500 mb-10 text-lg">Trang bạn đang tìm kiếm không tồn tại, đã bị xóa hoặc tạm thời đi vắng. Hãy kiểm tra lại đường dẫn nhé!</p>
        
        <!-- Nút bấm về Trang chủ -->
        <a href="{% url 'trang-chu' %}" class="flex items-center gap-3 px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-500 hover:shadow-[0_0_25px_rgba(37,99,235,0.4)] transition-all duration-300 transform hover:-translate-y-1">
            <i data-lucide="home" class="w-6 h-6"></i> Về lại Trang Chủ an toàn
        </a>
    </div>
</main>
{% endblock %}
